services:
  - type: web
    name: amman-camera-violations
    runtime: docker
    plan: free
    region: frankfurt
    envVars:
      - key: PORT
        value: 5000
      - key: NODE_ENV
        value: production
      - key: DB_PATH
        value: /data/database.sqlite
      - key: UPLOADS_DIR
        value: /data/uploads
    disk:
      name: amman-violations-data
      mountPath: /data
      sizeGB: 1
