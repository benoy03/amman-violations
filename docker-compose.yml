version: '3.8'

services:
  app:
    build: .
    container_name: amman_violations_app
    restart: always
    ports:
      - "5000:5000"
    environment:
      - PORT=5000
      - NODE_ENV=production
      - DB_PATH=/data/database.sqlite
      - UPLOADS_DIR=/data/uploads
    volumes:
      - amman_data:/data

volumes:
  amman_data:
    driver: local
