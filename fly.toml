# fly.toml — Fly.io configuration for AML Camera Violations System
# Amman Municipality — Automated Surveillance Department

app = "amman-violations"
primary_region = "cdg"  # Paris — closest free region to Amman

[build]
  dockerfile = "Dockerfile"

[env]
  PORT = "5000"
  NODE_ENV = "production"
  DB_PATH = "/data/database.sqlite"
  UPLOADS_DIR = "/data/uploads"

[http_service]
  internal_port = 5000
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

  [http_service.concurrency]
    type = "requests"
    hard_limit = 200
    soft_limit = 150

[[mounts]]
  source = "aml_data"
  destination = "/data"

[[vm]]
  size = "shared-cpu-1x"
  memory = "256mb"
